name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instalar dependencias del sistema
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # 4. Instalar buildozer y cython
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # 5. Cache del SDK/NDK de Android
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 6. Cache local de buildozer
      - name: Cache local .buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-local-${{ runner.os }}-

      # 7. Compilar el APK en modo debug
      - name: Build APK
        run: |
          yes | buildozer -v android debug
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # 8. Renombrar el APK con el nombre de la app y su version
      #    buildozer lo genera como bin/<paquete>-<version>-<arch>-debug.apk
      - name: Rename APK con nombre y version
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' buildozer.spec | head -n1 | cut -d= -f2 | tr -d ' ')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          FIRST=$(ls bin/*.apk 2>/dev/null | head -n1)
          if [ -z "$FIRST" ]; then echo "::error::No se genero ningun APK"; exit 1; fi
          NUEVO="bin/InDrive-Finanzas-${VERSION}.apk"
          mv "$FIRST" "$NUEVO"
          echo "APK generado: $NUEVO"
          ls -la bin/

      # 9. Subir el APK como artifact descargable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InDrive-Finanzas-APK
          path: bin/*.apk
          retention-days: 30
